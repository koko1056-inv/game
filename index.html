<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2e7d4f" />
  <title>もりのこ 〜林業タウン〜</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- ゲーム描画キャンバス -->
  <canvas id="game"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hud">
    <!-- 上段：資源 -->
    <div class="hud-top">
      <div class="resources">
        <div class="pill" id="pill-coins"><canvas class="ic" width="34" height="34" data-ic="coin"></canvas><span id="val-coins">0</span></div>
        <div class="pill" id="pill-wood"><canvas class="ic" width="34" height="34" data-ic="wood"></canvas><span id="val-wood">0</span></div>
        <div class="pill" id="pill-biodiv" title="生物多様性"><canvas class="ic" width="34" height="34" data-ic="leaf"></canvas><span id="val-biodiv">0</span></div>
        <div class="level">
          <div class="lv-badge">Lv<span id="val-level">1</span></div>
          <div class="xp"><div class="xp-fill" id="xp-fill"></div><span class="xp-text" id="xp-text">0/100</span></div>
        </div>
        <div class="season-chip" id="season-chip"><span class="se">🌸</span>1年目 春</div>
      </div>
      <div class="top-right">
        <button class="round-btn" id="btn-quests" title="クエスト">🎯<span class="badge" id="quest-badge">0</span></button>
        <button class="round-btn" id="btn-upgrades" title="アップグレード">🔧</button>
        <button class="round-btn" id="btn-sound" title="サウンド">🔊</button>
        <button class="round-btn" id="btn-menu" title="メニュー">☰</button>
      </div>
    </div>

    <!-- トースト通知 -->
    <div id="toasts" class="toasts"></div>

    <!-- イベントバナー -->
    <div id="event-banner" class="event-banner hidden"></div>

    <!-- 選択タイルのアクションカード -->
    <div id="action-card" class="action-card hidden">
      <button class="card-close" id="card-close">✕</button>
      <div class="card-icon" id="card-icon"></div>
      <div class="card-main">
        <div class="card-title" id="card-title">タイトル</div>
        <div class="card-sub" id="card-sub">説明</div>
        <div class="card-actions" id="card-actions"></div>
      </div>
    </div>

    <!-- 下段：建築バー -->
    <div class="buildbar" id="buildbar"></div>

    <!-- 配置モードのヒント -->
    <div id="place-hint" class="place-hint hidden">
      <span id="place-hint-text">置く場所をタップ</span>
      <button id="place-cancel">キャンセル</button>
    </div>
  </div>

  <!-- ===== クエストパネル ===== -->
  <div id="quest-panel" class="panel hidden">
    <div class="panel-card">
      <div class="panel-head"><h2>🎯 クエスト</h2><button class="panel-close" data-close="quest-panel">✕</button></div>
      <div id="quest-list" class="quest-list"></div>
    </div>
  </div>

  <!-- ===== アップグレードパネル ===== -->
  <div id="upgrade-panel" class="panel hidden">
    <div class="panel-card">
      <div class="panel-head"><h2>🔧 経営アップグレード</h2><button class="panel-close" data-close="upgrade-panel">✕</button></div>
      <div id="upgrade-list" class="quest-list"></div>
    </div>
  </div>

  <!-- ===== メニュー ===== -->
  <div id="menu-panel" class="panel hidden">
    <div class="panel-card">
      <div class="panel-head"><h2>☰ メニュー</h2><button class="panel-close" data-close="menu-panel">✕</button></div>
      <div class="menu-body">
        <p class="menu-stat" id="menu-stat"></p>
        <button class="menu-btn" id="btn-help">❓ 遊び方・林業まめ知識</button>
        <button class="menu-btn danger" id="btn-reset">🗑️ 最初からやり直す</button>
        <p class="credit">もりのこ — 林業経営シミュレーション</p>
      </div>
    </div>
  </div>

  <!-- ===== ヘルプ ===== -->
  <div id="help-panel" class="panel hidden">
    <div class="panel-card">
      <div class="panel-head"><h2>❓ 遊び方</h2><button class="panel-close" data-close="help-panel">✕</button></div>
      <div class="help-body" id="help-body"></div>
    </div>
  </div>

  <!-- ===== オープニング ===== -->
  <div id="intro" class="intro">
    <div class="intro-card">
      <div class="intro-logo">🌲 もりのこ</div>
      <div class="intro-tag">〜 木を植え、育て、伐り、運ぶ。林業タウン経営シミュレーション 〜</div>
      <button id="btn-start" class="start-btn">▶ はじめる</button>
      <p class="intro-note">苗木を植えて森を育て、木材を売って町を大きくしよう。<br>遊びながら林業のしくみが学べます。</p>
    </div>
  </div>

  <script src="src/audio.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/critters.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
